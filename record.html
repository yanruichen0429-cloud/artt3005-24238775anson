<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Centered Card (460px x 520px max dimensions, adaptive) -->
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200/80 w-full max-w-[460px] h-[520px] p-6 flex flex-col justify-between">
        
        <!-- Content Top Container -->
        <div class="flex flex-col flex-1">
            
            <!-- Large Image Placeholder -->
            <div class="w-full h-64 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 gap-2 mb-5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0z" />
                </svg>
                <span class="text-sm font-medium text-slate-500">Image Placeholder</span>
            </div>

            <!-- Title -->
            <h2 class="text-xl font-bold text-slate-800 tracking-tight mb-1">
                Archival Record #8492
            </h2>

            <!-- Small Grey Text -->
            <p class="text-sm text-slate-500 font-normal">
                Updated 2 hours ago • Category: Document Assets
            </p>
        </div>

        <!-- Bottom Action Button -->
        <div class="mt-auto">
            <button id="archiveBtn" onclick="archiveRecord()" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-medium rounded-xl transition-all duration-200 shadow-sm flex items-center justify-center gap-2">
                <span id="btnText">Archive this</span>
            </button>
            <div id="statusMsg" class="hidden text-center text-xs text-emerald-600 font-medium mt-2">
                ✓ Record archived successfully
            </div>
        </div>

    </div>

    <script>
        function archiveRecord() {
            const btn = document.getElementById('archiveBtn');
            const btnText = document.getElementById('btnText');
            const msg = document.getElementById('statusMsg');

            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');
            btnText.innerText = 'Archiving...';

            setTimeout(() => {
                btnText.innerText = 'Archived';
                msg.classList.remove('hidden');
            }, 500);
        }
    </script>
</body>
</html>
